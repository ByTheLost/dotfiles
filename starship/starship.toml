add_newline = true
command_timeout = 3600000
palette = "gentleman"

# format = """
# ($directory)\
# $os\
# $git_branch\
# $fill\
# $nodejs\
# $rust\
# $golang\
# $php\
# $bun\
# $java\
# $c\
# $conda\
# $zig\
# $cmd_duration\
# $time\
# \n$character\
# """

format = """
╭─󰣇 $username at $directory$git_branch$fill$nodejs$rust$golang$php$bun$java$c$conda$zig$cmd_duration$time
╰─$character
"""

[fill]
symbol = " "

# =========================
# CHARACTER
# =========================
[character]
# success_symbol = "[->❯ ](fg:green)"
success_symbol = "[❯ ](fg:green)"
error_symbol = "[ ](fg:red)"
vimcmd_symbol = "[N](bold red)"
vimcmd_replace_one_symbol = "[R](bold peach)"
vimcmd_visual_symbol = "[V](bold mauve)"

# =========================
# USERNAME (opcional)
# =========================
[username]
style_user = "bold blue"
style_root = "bold red"
format = "[❯ $user](fg:$style)"
show_always = true

# =========================
# DIRECTORY
# =========================
[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:blue"
read_only_style = "fg:blue"
truncate_to_repo = true
truncation_symbol = "…/"
read_only = "  "

[directory.substitutions]
Documents = "󰈙"
Downloads = "󰉍"
Music = "󰎈"
Pictures = "󰋩"

# =========================
# GIT
# =========================
[git_branch]
format = "->[$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " 󰊢  "

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:text bg:pink"

# =========================
# LANGUAGES
# =========================
[nodejs]
format = '[[ $symbol ($version) ](fg:green)]($style)'

[rust]
format = '[[ $symbol ($version) ](fg:red)]($style)'

[golang]
format = '[[ $symbol ($version) ](fg:teal)]($style)'

[php]
format = '[[ $symbol ($version) ](fg:peach)]($style)'

[bun]
format = '[[ $symbol ($version) ](fg:text)]($style)'

[java]
format = '[[ $symbol ($version) ](fg:red)]($style)'

[c]
format = '[[ $symbol ($version) ](fg:blue)]($style)'

[zig]
format = '[[ $symbol ($version) ](fg:peach)]($style)'

[lua]
format = '[[ $symbol ($version) ](fg:purple)]($style)'

# =========================
# CMD DURATION
# =========================
[cmd_duration]
format = " took [ $duration]($style) "
style = "bold fg:yellow"
min_time = 500

# =========================
# TIME
# =========================
[time]
disabled = false
time_format = "%R"
format = '[[   $time ](fg:subtext0)]($style)'

# =========================
# PALETTE
# =========================
[palettes.gentleman]
text = "#F3F6F9"
red = "#CB7C94"
green = "#B7CC85"
yellow = "#FFE066"
blue = "#7FB4CA"
mauve = "#A3B5D6"
pink = "#FF8DD7"
teal = "#7AA89F"
peach = "#DEBA87"
subtext0 = "#5C6170"
overlay0 = "#232A40"
rosewater = "#E0C15A"
flamingo = "#FF8DD7"
maroon = "#C4746E"
lavender = "#B99BF2"
subtext1 = "#8A8FA3"
overlay2 = "#313342"
overlay1 = "#191E28"
surface2 = "#27345C"
surface1 = "#232A40"
surface0 = "#191E28"
base = "none"
mantle = "#06080f"
crust = "#06080f"
